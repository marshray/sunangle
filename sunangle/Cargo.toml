[package]
name = "sunangle"
version = "0.1.0"
authors = [
    "Marsh Ray <marshray@live.com>"
    # With thanks to Emil Ernerfeldt for eframe and eframe_template!
]
edition.workspace = true
rust-version.workspace = true

#==================================== dependencies (all targets) ===================================

[dependencies]

#------------------------------------------ General purpose

anyhow.workspace = true
derive_more.workspace = true
hecs.workspace = true
hecs-hierarchy.workspace = true
log.workspace = true
num_enum.workspace = true
num-traits.workspace = true
once_cell.workspace = true
ron.workspace = true
serde.workspace = true
strum.workspace = true
thiserror.workspace = true

#------------------------------------------ Defined in this workspace

coordinate-systems.workspace = true
ecs-namespace.workspace = true
video.workspace = true

#------------------------------------------ Time

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8.4"
# tzfile = "0.1.3"
# humantime = "2.1.0" # A parser and formatter for std::time::{Duration, SystemTime}

#------------------------------------------ Graphics and UI

egui.workspace = true

glow.workspace = true
egui_glow.workspace = true

# https://github.com/emilk/egui/blob/main/crates/eframe/Cargo.toml
eframe = { workspace = true, default-features = false, features = [
    "accesskit",     # Make egui comptaible with screen readers
    "default_fonts", # Embed the default egui fonts
    "glow",          # Use the 'glow' rendering backend rather than 'wgpu'
    "persistence",   # Persist app state (window positions, etc)
] }

three-d = { workspace = true }
three-d-asset = { workspace = true }

#================================ dependencies (native app) ========================================

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

env_logger = "0.11.10"

egui-winit = {
    version = "0.34.1",
    default-features = false,
    features = [
        "wayland",       # Wayland
    ]
}

eframe = {
    workspace = true,
    default-features = false,
    features = [
        "wayland",       # Wayland
        "__screenshot",  # Puffin __screenshot is so we can dump a screenshot using EFRAME_SCREENSHOT_TO
    ]
}

puffin.workspace = true
puffin_egui.workspace = true
#puffin_http.workspace = true
profiling = { workspace = true, features = ["profile-with-puffin"] }

#============================== dependencies (wasm32 web app) ======================================

[target.'cfg(target_arch = "wasm32")'.dependencies]

wasm-bindgen = "0.2.118"

wasm-bindgen-futures = "0.4.68"

web-sys = "0.3.95"
# features = [ "HtmlCanvasElement", "WebGl2RenderingContext", "Window"]

#================================== dev-dependencies ===============================================

[dev-dependencies]
insta = { version = "1.47.2", features = ["ron"] }

